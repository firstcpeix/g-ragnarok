<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO Tools - คำนวณ Elu/Ori & แปลงเงิน M</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #b0b0b0;
            --input-bg: #2d2d2d;
            --input-text: #ffffff;
            --input-border: #444;
            --section-bg: #252525;
            --section-border: #333;
            --elu-title: #5499c7;
            --elu-border: #1b4f72;
            --ori-title: #bb8fce;
            --ori-border: #512e5f;
            --result-bg: #1f3a4d;
            --result-text: #ecf0f1;
            --grand-total: #f1c40f;
            --announcement-bg: #2a2a2a;
            --accent-gold: #f39c12;
            --bright-gold: #f1c40f;
            --thb-title-color: #4fa3e3;
            --zeny-title-color: #c39bd3;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-text: #000000;
            --input-border: #ccc;
            --section-bg: #fafbfc;
            --section-border: #e1e4e8;
            --elu-title: #2980b9;
            --elu-border: #d4e6f1;
            --ori-title: #8e44ad;
            --ori-border: #ebdef0;
            --result-bg: #e8f4f8;
            --result-text: #2c3e50;
            --grand-total: #d35400;
            --announcement-bg: #eef2f7;
            --accent-gold: #d35400;
            --bright-gold: #d35400;
            --thb-title-color: #1a5276;
            --zeny-title-color: #512e5f;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 10px;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Navigation Bar */
        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 1px solid var(--section-border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            color: var(--label-color);
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border-radius: 7px;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: white;
        }

        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            border: 1px solid var(--section-border);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 { 
            color: var(--text-color); 
            font-size: 17px; 
            margin: 0; 
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        /* Form Inputs (Elu/Ori) */
        .section { 
            background: var(--section-bg); 
            border: 1px solid var(--section-border); 
            border-radius: 8px; 
            padding: 12px; 
            margin-bottom: 12px; 
        }
        .section-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; border-bottom: 2px solid; padding-bottom: 4px; }
        .elu-title { color: var(--elu-title); border-color: var(--elu-border); }
        .ori-title { color: var(--ori-title); border-color: var(--ori-border); }

        .form-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 13px; color: var(--label-color); width: 60%; }
        input { 
            width: 38%; 
            padding: 6px; 
            box-sizing: border-box; 
            border: 1px solid var(--input-border); 
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 6px; 
            text-align: right; 
            font-size: 13px; 
        }

        .sub-total { font-size: 13px; font-weight: bold; text-align: right; margin-top: 6px; color: var(--text-color); }
        .result-box { margin-top: 15px; background: var(--result-bg); padding: 12px; border-radius: 8px; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: var(--result-text); }
        .grand-total { font-weight: bold; color: var(--grand-total); border-top: 1px dashed var(--input-border); padding-top: 6px; margin-top: 6px; font-size: 15px; text-shadow: 0 0 2px rgba(0,0,0,0.5); }

        .announcement-box {
            margin-top: 15px;
            background: var(--announcement-bg);
            border: 1px solid var(--section-border);
            padding: 12px;
            border-radius: 8px;
        }
        .announcement-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: var(--text-color); }
        
        /* ปุ่ม Wording แนะนำแบบเรียงติดกันและครอบพอดีประโยค */
        .template-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tpl-btn {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
            display: inline-block;
            transition: 0.2s;
            font-family: monospace;
        }
        .tpl-btn:hover {
            background: var(--accent-gold);
            color: white;
            border-color: var(--accent-gold);
        }

        .announcement-input {
            width: 100%;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--input-text);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            box-sizing: border-box;
            margin-bottom: 8px;
            text-align: left !important;
            font-weight: bold;
        }

        .copy-btn {
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .copy-success { background-color: #2980b9 !important; }

        /* Style สำหรับแปลงเงิน M */
        .money-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .money-column {
            background: var(--section-bg);
            border: 1px solid var(--section-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }
        .money-col-title {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            padding: 8px;
            background: var(--input-bg);
            border-radius: 6px;
            margin-bottom: 12px;
            border-bottom: 2px solid;
        }
        .title-thb {
            color: var(--thb-title-color);
            border-color: var(--thb-title-color);
        }
        .title-zeny {
            color: var(--zeny-title-color);
            border-color: var(--zeny-title-color);
        }

        .money-rows-scroll {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .money-row {
            display: flex;
            gap: 8px;
        }
        .money-row input {
            width: 48%;
            font-size: 14px;
            padding: 7px;
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            text-align: right;
            font-weight: bold;
        }
        .val-display {
            width: 52%;
            padding: 7px;
            font-size: 13px;
            text-align: right;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-weight: bold;
            box-sizing: border-box;
            color: var(--text-color);
        }
        .money-total-box {
            margin-top: 12px;
            background: var(--result-bg);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid var(--section-border);
            color: var(--text-color);
        }
        .bright-gold-text {
            color: var(--bright-gold) !important;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <!-- Navbar สลับแท็บ -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-elu')">🛡️ คำนวณ Elu / Ori</button>
        <button class="tab-btn" onclick="switchTab('tab-money')">💰 แปลงเงิน บาท ↔ zeny</button>
    </div>

    <div class="card">
        <div class="header-container">
            <h2 id="pageTitle">คำนวณราคา Elu / Ori</h2>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
        </div>

        <!-- TAB 1: คำนวณ Elu / Ori -->
        <div id="tab-elu" class="tab-content active">
            <!-- โซน Elu -->
            <div class="section">
                <div class="section-title elu-title">🛡️ Elunium (Elu)</div>
                <div class="form-group">
                    <label>ราคาต่อก้อนเล็ก (zeny):</label>
                    <input type="text" id="eluPrice" oninput="formatInputNumber(this); calculateEluOri();" placeholder="0">
                </div>
                <div class="form-group">
                    <label>จำนวนก้อนเล็ก (ก้อน):</label>
                    <input type="text" id="eluQtySmall" oninput="formatInputNumber(this); calculateEluOri();" placeholder="0">
                </div>
                <div class="form-group">
                    <label>จำนวนก้อนใหญ่ (ก้อน):</label>
                    <input type="text" id="eluQtyBig" oninput="formatInputNumber(this); calculateEluOri();" placeholder="0">
                </div>
                <div class="sub-total">รวม Elu: <span id="eluTotal">0</span> zeny</div>
            </div>

            <!-- โซน Ori -->
            <div class="section">
                <div class="section-title ori-title">⚔️ Oridecon (Ori)</div>
                <div class="form-group">
                    <label>ราคาต่อก้อนเล็ก (zeny):</label>
                    <input type="text" id="oriPrice" oninput="formatInputNumber(this); calculateEluOri();" placeholder="0">
                </div>
                <div class="form-group">
                    <label>จำนวนก้อนเล็ก (ก้อน):</label>
                    <input type="text" id="oriQtySmall" oninput="formatInputNumber(this); calculateEluOri();" placeholder="0">
                </div>
                <div class="form-group">
                    <label>จำนวนก้อนใหญ่ (ก้อน):</label>
                    <input type="text" id="oriQtyBig" oninput="formatInputNumber(this); calculateEluOri();" placeholder="0">
                </div>
                <div class="sub-total">รวม Ori: <span id="oriTotal">0</span> zeny</div>
            </div>

            <!-- ผลลัพธ์รวมทั้งหมด -->
            <div class="result-box">
                <div class="result-row"><span>ราคารวม Elu:</span> <span id="resElu">0 zeny</span></div>
                <div class="result-row"><span>ราคารวม Ori:</span> <span id="resOri">0 zeny</span></div>
                <div class="result-row grand-total"><span>ราคารวมทั้งสิ้น:</span> <span id="grandTotal" class="bright-gold-text">0 zeny</span></div>
            </div>

            <!-- โซน Wording ประกาศราคา -->
            <div class="announcement-box">
                <div class="announcement-title">📢 เลือกรูปแบบ Wording ประกาศราคา:</div>
                <!-- ปุ่ม Wording แนะนำเรียงต่อกันแบบพอดีคำ -->
                <div class="template-buttons">
                    <button class="tpl-btn" onclick="setTemplate('รับ Elu{elu} Ori{ori} เคาะเดล')">รับ Elu{elu} Ori{ori} เคาะเดล</button>
                    <button class="tpl-btn" onclick="setTemplate('[อยู่]ร.Elu{elu} Ori{ori} เคาะเดล')">[อยู่]ร.Elu{elu} Ori{ori} เคาะเดล</button>
                    <button class="tpl-btn" onclick="setTemplate('[On]ร.Elu{elu} Ori{ori} เคาะเดล')">[On]ร.Elu{elu} Ori{ori} เคาะเดล</button>
                </div>
                <input type="text" id="announcementText" class="announcement-input" value="[อยู่]ร.Elu0 Ori0 เคาะเดล">
                <button class="copy-btn" id="copyBtn" onclick="copyAnnouncement()">📋 Copy ข้อความไปใช้</button>
            </div>
        </div>

        <!-- TAB 2: แปลงเงิน M (บาท <-> zeny) -->
        <div id="tab-money" class="tab-content">
            <div class="section">
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="font-weight: bold; color: var(--text-color);">เรท บาท / m (1,000,000 zeny):</label>
                    <input type="text" id="mRate" oninput="formatInputNumber(this); calculateMoney();" placeholder="800" value="800">
                </div>
            </div>

            <div class="money-container">
                <!-- ฝั่งซ้าย: แปลง บาท -> Zeny -->
                <div class="money-column">
                    <div class="money-col-title title-thb">แปลง บาท ➔ Zeny</div>
                    <div class="money-rows-scroll" id="thbToZenyRows"></div>
                    <div class="money-total-box">
                        รวม Zeny: <span id="totalZenyOut" class="bright-gold-text">0 z</span>
                    </div>
                </div>

                <!-- ฝั่งขวา: แปลง Zeny -> บาท -->
                <div class="money-column">
                    <div class="money-col-title title-zeny">แปลง Zeny ➔ บาท</div>
                    <div class="money-rows-scroll" id="zenyToThbRows"></div>
                    <div class="money-total-box">
                        รวม บาท: <span id="totalThbOut" class="bright-gold-text">0 ฿</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentEluText = "0";
let currentOriText = "0";
let activeTemplate = "[อยู่]ร.Elu{elu} Ori{ori} เคาะเดล";

window.onload = function() {
    let thbContainer = document.getElementById('thbToZenyRows');
    let zenyContainer = document.getElementById('zenyToThbRows');

    for (let i = 0; i < 10; i++) {
        let row1 = document.createElement('div');
        row1.className = 'money-row';
        row1.innerHTML = `<input type="text" class="thb-in" oninput="formatInputNumber(this); calculateMoney();" placeholder="บาท"><div class="val-display zeny-out">0 z</div>`;
        thbContainer.appendChild(row1);

        let row2 = document.createElement('div');
        row2.className = 'money-row';
        row2.innerHTML = `<input type="text" class="zeny-in" oninput="formatInputNumber(this); calculateMoney();" placeholder="zeny"><div class="val-display thb-out">0 ฿</div>`;
        zenyContainer.appendChild(row2);
    }
};

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');

    let title = tabId === 'tab-elu' ? 'คำนวณราคา Elu / Ori' : 'แปลงเงิน M (บาท ↔ zeny)';
    document.getElementById('pageTitle').innerText = title;
}

function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        btn.innerText = '🌙 Dark Mode';
    } else {
        body.setAttribute('data-theme', 'dark');
        btn.innerText = '☀️ Light Mode';
    }
}

function formatInputNumber(input) {
    let value = input.value.replace(/,/g, '');
    if (!isNaN(value) && value !== "") {
        let parts = value.split('.');
        parts[0] = Number(parts[0]).toLocaleString();
        input.value = parts.join('.');
    }
}

function getCleanValue(id) {
    let val = document.getElementById(id).value.replace(/,/g, '');
    return parseFloat(val) || 0;
}

function formatPriceXX(price) {
    if (!price || price <= 0) return "0";
    return price / 1000;
}

function setTemplate(templateStr) {
    activeTemplate = templateStr;
    updateAnnouncementText();
}

function updateAnnouncementText() {
    let eluPStr = document.getElementById('eluPrice').value.trim();
    let oriPStr = document.getElementById('oriPrice').value.trim();
    let eluP = getCleanValue('eluPrice');
    let oriP = getCleanValue('oriPrice');

    let newEluText = eluPStr !== "" ? formatPriceXX(eluP) : "0";
    let newOriText = oriPStr !== "" ? formatPriceXX(oriP) : "0";

    let resultText = activeTemplate
        .replace('{elu}', newEluText)
        .replace('{ori}', newOriText);

    document.getElementById('announcementText').value = resultText;
}

function calculateEluOri() {
    let eluP = getCleanValue('eluPrice');
    let eluQS = getCleanValue('eluQtySmall');
    let eluQB = getCleanValue('eluQtyBig');
    let totalEluQty = eluQS + (eluQB * 5); 
    let eluT = Math.round(eluP * totalEluQty);

    let oriP = getCleanValue('oriPrice');
    let oriQS = getCleanValue('oriQtySmall');
    let oriQB = getCleanValue('oriQtyBig');
    let totalOriQty = oriQS + (oriQB * 5); 
    let oriT = Math.round(oriP * totalOriQty);

    let grandT = eluT + oriT;

    document.getElementById('eluTotal').innerText = eluT.toLocaleString();
    document.getElementById('oriTotal').innerText = oriT.toLocaleString();
    
    document.getElementById('resElu').innerText = eluT.toLocaleString() + " zeny";
    document.getElementById('resOri').innerText = oriT.toLocaleString() + " zeny";
    document.getElementById('grandTotal').innerText = grandT.toLocaleString() + " zeny";

    updateAnnouncementText();
}

function copyAnnouncement() {
    let textToCopy = document.getElementById('announcementText').value;
    navigator.clipboard.writeText(textToCopy).then(() => {
        let btn = document.getElementById('copyBtn');
        btn.innerText = "✅ คัดลอกสำเร็จ!";
        btn.classList.add("copy-success");
        setTimeout(() => {
            btn.innerText = "📋 Copy ข้อความไปใช้";
            btn.classList.remove("copy-success");
        }, 1500);
    });
}

function calculateMoney() {
    let rate = getCleanValue('mRate'); 
    if (rate <= 0) return;

    let thbInputs = document.querySelectorAll('.thb-in');
    let zenyOutputs = document.querySelectorAll('.zeny-out');
    let sumZenyOut = 0;

    thbInputs.forEach((input, idx) => {
        let thbVal = parseFloat(input.value.replace(/,/g, '')) || 0;
        let zenyVal = Math.round((thbVal / rate) * 1000000);
        sumZenyOut += zenyVal;
        zenyOutputs[idx].innerText = zenyVal > 0 ? zenyVal.toLocaleString() + " z" : "0 z";
    });

    let zenyInputs = document.querySelectorAll('.zeny-in');
    let thbOutputs = document.querySelectorAll('.thb-out');
    let sumThbOut = 0;

    zenyInputs.forEach((input, idx) => {
        let zenyVal = parseFloat(input.value.replace(/,/g, '')) || 0;
        let thbVal = (zenyVal / 1000000) * rate;
        sumThbOut += thbVal;
        thbOutputs[idx].innerText = thbVal > 0 ? thbVal.toLocaleString(undefined, {maximumFractionDigits: 2}) + " ฿" : "0 ฿";
    });

    document.getElementById('totalZenyOut').innerText = Math.round(sumZenyOut).toLocaleString() + " z";
    document.getElementById('totalThbOut').innerText = sumThbOut.toLocaleString(undefined, {maximumFractionDigits: 2}) + " ฿";
}
</script>

</body>
</html>
